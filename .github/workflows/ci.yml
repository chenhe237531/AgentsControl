name: CI

# 设计说明
# 1) 六路 job 并行（backend / web / agent / migrations / plan / secrets），总时长目标 < 4 分钟；
# 2) 分支保护只要求一个必过检查：`gate`。它聚合全部结果，
#    因此新增/改名 job 不需要动仓库设置（10 个窗口并行时这点很关键）；
# 3) 所有 job 都有 timeout，防止挂死的测试吃掉额度；
# 4) 每个 job 都设了 `if: always()` 的兜底，任何一路失败都不会让 gate 卡在 pending。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  GO_VERSION: "1.23"

jobs:
  backend:
    name: backend · lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        env:
          APP_ENV: dev
        run: pytest -q

  migrations:
    name: backend · migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afc
          POSTGRES_PASSWORD: afc
          POSTGRES_DB: afc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U afc" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://afc:afc@localhost:5432/afc
      DATABASE_URL_SYNC: postgresql+psycopg://afc:afc@localhost:5432/afc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 单一 head 检查（防止两个窗口各建一个 head）
        run: |
          heads=$(alembic heads | grep -c "(head)" || true)
          echo "heads=$heads"
          alembic heads
          if [ "$heads" != "1" ]; then
            echo "::error::迁移出现多头，请先 alembic merge 生成合并 revision"
            exit 1
          fi
      - name: upgrade → downgrade → upgrade（迁移必须可回滚）
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  agent:
    name: agent · go vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未格式化：$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - run: go build ./...

  web:
    name: web · typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          # 有 lockfile 必须用 ci（确定性）；骨架期未提交 lockfile 时退化为 install
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::缺少 package-lock.json，暂用 npm install；W10 必须补交 lockfile"
            npm install --no-audit --no-fund
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

  plan:
    name: plan · 边界与契约
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要 diff 才能判断越界与冻结文件改动
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install pyyaml
      - name: Window boundaries
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1
          python scripts/check_boundaries.py --changed --base "$base"
      - name: 冲突标记与本地卫生
        run: bash scripts/pr_precheck.sh --local || [ $? -eq 2 ]
      - name: OpenAPI 契约快照
        run: |
          python -m pip install --quiet --no-input -e backend 2>/dev/null || pip install -q -e backend
          if [ -f backend/openapi.snapshot.json ]; then
            python scripts/openapi_snapshot.py --check
          else
            echo "::warning::尚无 openapi.snapshot.json（W01-I05 交付后启用此检查）"
          fi

  secrets:
    name: repo · secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 禁止提交 .env 与私钥
        run: |
          set -e
          bad=$(git ls-files | grep -E '(^|/)\.env$|\.pem$|\.p12$|id_rsa$' || true)
          if [ -n "$bad" ]; then echo "发现疑似密钥文件："; echo "$bad"; exit 1; fi
      - name: 禁止硬编码高风险字面量
        run: |
          set -e
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' -- . ':!*.md' ':!*.lock'; then
            echo "疑似真实令牌被提交"; exit 1
          fi

  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [backend, migrations, agent, web, plan, secrets]
    if: always()
    steps:
      - name: 聚合结果
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "migrations=${{ needs.migrations.result }}"
          echo "agent=${{ needs.agent.result }}"
          echo "web=${{ needs.web.result }}"
          echo "plan=${{ needs.plan.result }}"
          echo "secrets=${{ needs.secrets.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::存在未通过的检查，见上方各 job"
            exit 1
          fi
          echo "全部门禁通过"
