# 冻结文件：任何窗口改动需 label: x-shared-registry
frozen:
  - path: backend/app/api/router.py
    reason: 10 个窗口的集中注册点，是 100% 冲突热点
    owner: W01
  - path: web/src/config/nav.ts
    reason: 每个窗口都想加菜单项
    owner: W10
  - path: backend/app/core/
    reason: 9 个窗口的公共依赖
    owner: W01
  - path: agent/internal/protocol/types.go
    reason: 跨端契约，单边改动造成静默数据错乱
    owner: W04+W05
  - path: plan/windows.yaml
    reason: 计划即契约
    owner: marshal
  - path: .github/workflows/ci.yml
    reason: 门禁定义，不能被单窗口放松
    owner: W09
