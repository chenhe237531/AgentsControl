version: 1
# 机器可读的窗口与 issue 清单。
# 这是「契约」不是「备注」：改动需走 shared-registry 变更请求，且只在 Wave 边界合并。
# 校验：python scripts/check_boundaries.py
# 进度：./scripts/window-status.sh
#
# 字段说明
#   allow        本窗口唯一可写的路径（其余一律禁止）
#   wave         合并波次（不是开发顺序；窗口可提前写，但按波次合并）
#   commit       提交消息前缀，必须含 (#issue)
#   depends_on   必须先合并的 issue（跨窗口依赖也在这里写）
#   files        本 issue 主要改动的文件，用于冲突预判（不是硬约束）

